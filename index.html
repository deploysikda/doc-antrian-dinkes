<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>ANTRIAN DINKES DOKUMENTASI</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <!-- Docsify Theme: Dark/Light Mode -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css" title="docsify-darklight-theme" type="text/css"/>
  <style>
    /* Agar ikon tema tetap pada posisinya saat di-scroll, baik desktop maupun mobile */
    #docsify-darklight-theme {
      position: fixed !important;
      z-index: 9999 !important;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Dokumentasi Antrian Dinkes',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      search: {
        maxAge: 86400000, // cache 1 hari
        paths: 'auto',    // otomatis cari di semua file
        placeholder: 'Cari Topik...',
        noData: 'Tidak ditemukan',
        depth: 3
      },
      darklightTheme: {
        defaultTheme: 'system',
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Docsify Search Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <!-- Docsify Darklight Theme Plugin -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>
</body>

</html>
